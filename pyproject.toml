[project]
name = "kindle-notion-sync"
version = "0.1.0"
description = "Sync PDFs between a Notion database and a Kindle Scribe."
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.195.0",
    "google-auth>=2.50.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "notion-client>=3.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]
